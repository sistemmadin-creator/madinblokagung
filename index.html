<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Database Santri - Madrasah Diniyyah Al Amiriyyah</title>

  <!-- Favicon Tab Browser -->
  <link rel="shortcut icon" href="https://drive.google.com/thumbnail?id=1Fkm2_aiu-me47Fm1weDrpHMCHZBThzrD&sz=w128" type="image/png">
  <link rel="icon" href="https://drive.google.com/thumbnail?id=1Fkm2_aiu-me47Fm1weDrpHMCHZBThzrD&sz=w128" type="image/png">

  <!-- Tipografi Modern Google Fonts 'Inter' -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Bootstrap 5.3, DataTables 1.13.6 & Bootstrap Icons 1.10.5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <!-- Stylesheet Kustom Utama -->
  <link rel="stylesheet" href="/src/css/style.css">
</head>
<body class="sidebar-collapsed">

  <!-- ============================================== -->
  <!-- 1. TOP NAVBAR DENGAN JUDUL & MENU PROFIL       -->
  <!-- ============================================== -->
  <nav class="top-navbar d-flex justify-content-between align-items-center">
    <div class="brand fw-bold text-dark fs-5 d-flex align-items-center">
      <div class="bg-white p-1 rounded-circle shadow-sm border me-2 d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
        <img id="nav_logo_img"
             src="https://drive.google.com/thumbnail?id=1Fkm2_aiu-me47Fm1weDrpHMCHZBThzrD&sz=w200"
             alt="Logo"
             style="width: 28px; height: 28px; object-fit: contain;"
             onerror="this.style.display='none';">
      </div>
      <span style="letter-spacing: -0.5px;">Madin Blokagung</span>
    </div>

    <div class="dropdown">
      <button class="header-profile-btn" type="button" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="header-avatar">
          <i class="bi bi-person-fill d-none d-sm-block"></i>
          <i class="bi bi-list d-block d-sm-none fs-5"></i>
        </div>
        <div class="text-start d-none d-sm-block me-1">
          <div class="fw-bold text-dark lh-1" style="font-size: 0.8rem;">Menu Profil</div>
          <div class="text-muted" style="font-size: 0.65rem;">Pengaturan & Keluar</div>
        </div>
        <i class="bi bi-chevron-down text-muted d-none d-sm-block" style="font-size: 0.7rem;"></i>
      </button>

      <ul class="dropdown-menu dropdown-menu-end header-dropdown-menu">
        <li class="px-3 py-2 text-center border-bottom mb-2 bg-light rounded" style="margin-top: -4px;">
          <div class="fw-bold text-dark fs-6" id="navUserNama">Master Administrator</div>
          <span class="badge rounded-pill mt-1 role-badge-admin" id="navUserRoleBadge" style="font-size: 10px;">Master Admin</span>
        </li>

        <li class="rbac-master-only">
          <a class="dropdown-item py-2 fw-semibold text-secondary d-flex align-items-center gap-2" href="#" data-bs-toggle="modal" data-bs-target="#modalAdminCenter" onclick="window.loadAuditLogs()">
            <i class="bi bi-gear-fill text-primary"></i> Pusat Kendali Admin
          </a>
        </li>

        <li><hr class="dropdown-divider rbac-master-only"></li>

        <li>
          <a class="dropdown-item py-2 fw-bold text-danger d-flex align-items-center gap-2" href="#" onclick="window.actionLogout()">
            <i class="bi bi-box-arrow-right fs-5"></i> Keluar / Logout
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- ============================================== -->
  <!-- 2. SIDEBAR DESKTOP (AUTO HOVER EXPAND/COLLAPSE)-->
  <!-- ============================================== -->
  <div class="sidebar-overlay close" id="desktopSidebar">
    <div class="header">
      <div class="brand"></div>
      <div class="toggle-btn" onclick="window.toggleSidebar()">
        <i class="bi bi-chevron-left"></i>
      </div>
    </div>

    <nav class="nav flex-column w-100 mt-2">
      <a class="nav-link active" id="nav-desk-santri" onclick="window.showPage('santri')">
        <i class="bi bi-person"></i> <span>Data Santri</span>
      </a>
      <a class="nav-link" id="nav-desk-asatidz" onclick="window.showPage('asatidz')">
        <i class="bi bi-people"></i> <span>Data Asatidz</span>
      </a>
      <a class="nav-link" id="nav-desk-formasi" onclick="window.showPage('formasi')">
        <i class="bi bi-building"></i> <span>Formasi Kelas</span>
      </a>
      <a class="nav-link" onclick="jQuery('#settingsModal').modal('show')">
        <i class="bi bi-diagram-3"></i> <span>Hierarki Dropdown</span>
      </a>
      <a class="nav-link" data-bs-toggle="modal" data-bs-target="#modalAdminCenter" onclick="window.loadAuditLogs()">
        <i class="bi bi-journal-text"></i> <span>Log Aktivitas</span>
      </a>
    </nav>
  </div>

  <!-- ============================================== -->
  <!-- 3. BOTTOM NAVIGATION (KHUSUS MOBILE < 768px)   -->
  <!-- ============================================== -->
  <div class="bottom-nav d-md-none">
    <a class="nav-link active" id="nav-mob-santri" onclick="window.showPage('santri')">
      <i class="bi bi-person"></i><span>Santri</span>
    </a>
    <a class="nav-link" id="nav-mob-asatidz" onclick="window.showPage('asatidz')">
      <i class="bi bi-people"></i><span>Asatidz</span>
    </a>
    <a class="nav-link" id="nav-mob-formasi" onclick="window.showPage('formasi')">
      <i class="bi bi-building"></i><span>Formasi</span>
    </a>
    <a class="nav-link" onclick="jQuery('#settingsModal').modal('show')">
      <i class="bi bi-diagram-3"></i><span>Hierarki</span>
    </a>
    <a class="nav-link" data-bs-toggle="modal" data-bs-target="#modalAdminCenter" onclick="window.loadAuditLogs()">
      <i class="bi bi-journal-text"></i><span>Log</span>
    </a>
  </div>

  <!-- ======================================================= -->
  <!-- 4. WADAH DINAMIS KONTEN HALAMAN (DARI SRC/PAGES)        -->
  <!-- ======================================================= -->
  <div class="main-content" id="pages-container"></div>

  <!-- ======================================================= -->
  <!-- 5. WADAH DINAMIS KOMPONEN MODAL (DARI SRC/PARTIALS)     -->
  <!-- ======================================================= -->
  <div id="modals-container"></div>

  <!-- Library Eksternal (jQuery, Bootstrap 5.3, DataTables 1.13.6, SheetJS 0.18.5) -->
  <script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
  <script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Script Aplikasi Utama (Vite Module) -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
