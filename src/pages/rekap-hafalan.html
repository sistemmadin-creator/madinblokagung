<!-- ============================================== -->
<!-- HALAMAN: REKAP HAFALAN PERTINGKATAN (BARU) -->
<!-- ============================================== -->
<div id="page-rekap-hafalan" style="display: none;">
  <!-- Header & Toolbar -->
  <div class="card-panel mb-4 border-0">
    <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">
      <div>
        <h4 class="fw-bold text-dark m-0">Rekapitulasi Hafalan Pertingkatan</h4>
        <p class="text-muted small m-0 mt-1">Pantau progress hafalan santri kategori wajib maupun tahfidz per tingkatan madrasah diniyyah</p>
      </div>

      <!-- Action Toolbar -->
      <div class="d-flex gap-2 align-items-center flex-wrap">
        <div class="dash-pill-group" id="rekapModeToggle">
          <button type="button" class="dash-pill-btn active" id="pill_rekap_wajib" onclick="window.switchRekapMode('wajib')">Hafalan Wajib</button>
          <button type="button" class="dash-pill-btn" id="pill_rekap_tahfidz" onclick="window.switchRekapMode('tahfidz')">Hafalan Tahfidz</button>
        </div>
        <select id="filterTingkat" class="form-select form-select-sm border-secondary fw-semibold" onchange="window.loadRekapData()" style="width: 160px;">
          <option value="ULA" selected>Tingkat ULA</option>
          <option value="WUSTHO">Tingkat WUSTHO</option>
          <option value="ULYA">Tingkat ULYA</option>
        </select>
        <!-- Tombol Cetak A4 -->
        <button onclick="window.cetakRekapHafalanA4()" class="btn btn-sm btn-outline-dark fw-bold me-2">
          <i class="bi bi-printer me-1"></i> Cetak A4
        </button>

        <button onclick="window.exportToExcel()" class="btn btn-sm btn-success fw-bold">
          <i class="bi bi-file-earmark-excel-fill me-1"></i> Export Excel
        </button>
      </div>
    </div>
  </div>
  <!-- Loading State -->
  <div id="rekapLoading" class="text-center py-5" style="display: none;">
    <div class="spinner-border text-success" role="status"></div>
    <p class="text-muted small mt-2">Sedang memuat data rekapitulasi hafalan...</p>
  </div>
  <!-- Container Tabel Hasil Rekap -->
  <div id="rekapTableContainer"></div>
</div>
